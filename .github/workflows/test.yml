# 테스트 — 표준 라이브러리만 쓰므로 설치할 것이 없다.
#
# 🔴 **배포가 이 워크플로를 불러 쓴다**(`deploy.yml` 의 `jobs.test.uses`). 2026-09-28 B48 까지는
# 둘이 같은 push 에서 **따로** 돌았다 — 그래서 **테스트가 빨개도 사이트가 나갔다.**
# 빌드가 막는 것 다섯(스냅숏·매핑·인원 링크·출발 공항·칩)을 쌓아 두고도, 정작 그 코드를 지키는
# 단위 테스트는 문지기가 아니었다.
#
# 🔒 **테스트 단계를 `deploy.yml` 에 복사하지 않는다.** 복사하면 한쪽만 자란다 —
# 이 저장소가 다섯 번 겪은 그것이고, 하필 **검사하는 쪽**이 갈리면 그게 제일 조용하다.
# 그래서 `workflow_call` 로 열어 두고 배포가 **같은 것**을 부른다.
name: test

on:
  # 배포가 부른다 — 이게 문지기 경로다.
  workflow_call:
  pull_request:
  workflow_dispatch:
  # ⚠️ `push` 를 뺐다. 배포가 같은 push 에서 이 워크플로를 부르므로 두 번 돌 이유가 없고,
  # 두 번 돌면 **어느 쪽이 배포를 막았는지**가 흐려진다. `.md` 만 바뀐 push 는 배포가 건너뛰는데,
  # 테스트가 읽는 건 JS·CSS·`site/*.py`·픽스처뿐이라 그때 잃는 신호가 없다.

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 단위 테스트
        run: python -m unittest discover -s tests -v

      # 🔴 **빌드가 실제로 도는지**까지 본다. 단위 테스트는 차트 함수만 보고
      # 화면 전체가 만들어지는지는 안 본다 — 이 프로젝트가 반복해 확인한 것이
      # 「테스트 통과는 화면이 멀쩡하다는 증거가 아니다」이다.
      # 픽스처로 구우므로 네트워크도 백엔드도 필요 없다.
      - name: 픽스처로 빌드가 도는가
        run: |
          set -e
          # 픽스처도 라이브와 **같은 스냅숏 검사**를 받는다 — 한 발행분으로 받아 적었기 때문이다.
          # (2026-09-19 전엔 옛 픽스처가 규칙 이전 발행이라 검사를 껐다. BACKLOG B40)
          python site/build.py --api fixtures/v1 --out /tmp/dist
          for f in index.html sitemap.xml robots.txt build.json \
                   assets/discover.js assets/discover.css data/world.geojson; do
            test -s "/tmp/dist/$f" || { echo "::error::빠졌다: $f"; exit 1; }
          done
          n=$(ls /tmp/dist/routes/*.html | wc -l)
          test "$n" -ge 30 || { echo "::error::노선 페이지가 $n 장뿐이다"; exit 1; }
          echo "노선 $n 장"
